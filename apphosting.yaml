# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

  # OpenAI calls run only at request time. The secret value is managed outside Git.
env:
  - variable: OPENAI_API_KEY
    secret: openaiApiKey

  - variable: OPENAI_DEFAULT_MODEL
    value: gpt-5.6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_CATEGORIZATION_MODEL
    value: gpt-5.6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_RECIPE_MODEL
    value: gpt-5.6-terra
    availability:
      - RUNTIME

  - variable: OPENAI_MAINTENANCE_MODEL
    value: gpt-5.6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_OVERVIEW_MODEL
    value: gpt-5.6-luna
    availability:
      - RUNTIME

  # App Check (reCAPTCHA Enterprise). Site keys are public; the key only works on
  # HomeHub's own domains. Needed at build time because NEXT_PUBLIC_* is inlined.
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: 6LelURMuAAAAAGp_BMQ-5nXZu2EVl8NPtKtvlebO
    availability:
      - BUILD
      - RUNTIME
