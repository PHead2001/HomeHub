# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

  # OpenAI calls run only at request time. The secret value is managed outside Git.
env:
  - variable: OPENAI_API_KEY
    secret: openaiApiKey

  - variable: OPENAI_DEFAULT_MODEL
    value: gpt-6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_CATEGORIZATION_MODEL
    value: gpt-6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_RECIPE_MODEL
    value: gpt-6.1-terra
    availability:
      - RUNTIME

  - variable: OPENAI_MAINTENANCE_MODEL
    value: gpt-6-luna
    availability:
      - RUNTIME

  - variable: OPENAI_OVERVIEW_MODEL
    value: gpt-6-luna
    availability:
      - RUNTIME

  # App Check (reCAPTCHA Enterprise). Site keys are public; the key only works on
  # HomeHub's own domains. Needed at build time because NEXT_PUBLIC_* is inlined.
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: 6LelURMuAAAAAGp_BMQ-5nXZu2EVl8NPtKtvlebO
    availability:
      - BUILD
      - RUNTIME

  # Firebase web app ID (public). Declared here so the build always gets the full
  # `1:`-prefixed form; App Check rejects the short form.
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:562837692805:web:a21c3805ca4921564d24ec
    availability:
      - BUILD
      - RUNTIME

  # Wall-tablet PIN pepper (docs/modules/devices/README.md, "PINs"). Server runtime
  # only, never NEXT_PUBLIC_. src/lib/server/pin-hash.ts reads
  # HOMEHUB_PIN_PEPPER_CURRENT (the id new hashes use) and HOMEHUB_PIN_PEPPER_<id>
  # (that id's secret; the id is used case-exact, so V1 -> HOMEHUB_PIN_PEPPER_V1).
  # Rotation: add HOMEHUB_PIN_PEPPER_V2 and set CURRENT to V2, keeping V1.
  - variable: HOMEHUB_PIN_PEPPER_V1
    secret: homehubPinPepperV1

  - variable: HOMEHUB_PIN_PEPPER_CURRENT
    value: V1
    availability:
      - RUNTIME
