name: Authenticated E2E Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-smoke:
    name: Validate and run authenticated smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Load demo emulator environment
        shell: bash
        run: |
          while IFS= read -r line; do
            if [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> "$GITHUB_ENV"
            fi
          done < .env.e2e.example

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate module documentation
        run: npm run docs:check

      - name: Build application
        run: npm run build

      - name: Run authenticated E2E smoke tests
        run: npm run test:e2e:ci

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            firebase-debug.log
            firestore-debug.log
            ui-debug.log
          if-no-files-found: ignore
          retention-days: 10
